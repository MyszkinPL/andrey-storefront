services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_URL: ${APP_URL}
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH}
      DEV_TELEGRAM_ID: ${DEV_TELEGRAM_ID}
